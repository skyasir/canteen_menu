[project]
name = "canteen_menu"
authors = [{ name = "Yasir Shaikh", email = "erp.yasirshaikh@gmail.com" }]
description = "Canteen menu cycles for ERPNext - plan a rotating menu per canteen and expose only today's menu items in Point of Sale"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
